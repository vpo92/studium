name: Build and Push Worker Docker Image

on:
  workflow_dispatch: # Permet aussi de lancer le build manuellement depuis l'interface GitHub

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vpo92/studium/worker

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    # Donne les droits au jeton GitHub Actions de pousser sur le registre de paquets
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          # Le worker est construit depuis api/Dockerfile : même version que l'API.
          VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' api/package.json | head -n1)
          if [ -z "$VERSION" ]; then echo "version introuvable dans api/package.json" >&2; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Utilise le jeton natif généré automatiquement pour chaque exécution
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: api/Dockerfile
          # Etape "worker" de l'API : meme image runtime, CMD node worker.js
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
