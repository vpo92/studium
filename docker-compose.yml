services:

  studium_mongo:
    image: mongo:4.2.22
    container_name: "studium_mongo"
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - mongodb_data:/data/db
    networks:
      default:
        aliases:
          - mongodb
      npm-net:
        aliases:
          - mongodb
    expose:
      - 27017


  studium_api:
    image: ghcr.io/vpo92/studium/api:latest
    expose:
      - 3000
    depends_on:
      - studium_mongo
    environment:
      - NODE_ENV=production
      - APP_MODE=PROD
      - MONGODB_CONNECTION_STRING=mongodb://studium_mongo:27017/studium      
      - MONGO_URL=mongodb://studium_mongo/studium
    restart: always
    networks:
     - default
     - npm-net
    

  studium_admin:
    image: ghcr.io/vpo92/studium/admin:latest
    environment:
      - API_URL=${API_URL:-http://studium_api:3000}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:3003/api}
      - APPLICATION_URL=${APPLICATION_URL:-http://localhost:3003}

    expose:
      - 3002

    networks:
     - default
     - npm-net

  studium_nginx:
    image: nginx:alpine
    container_name: "studium_nginx"
    restart: always
    ports:
      - 3003:80
    depends_on:
      - studium_api
      - studium_admin
    networks:
      - default
      - npm-net
    command:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' > /etc/nginx/conf.d/default.conf
        server {
            listen 80;
            server_name localhost;

            client_max_body_size 50M;

            # API endpoints
            location /api/ {
                proxy_pass http://studium_api:3000/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }

            location = /api {
                proxy_pass http://studium_api:3000/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }

            # Admin application
            location / {
                proxy_pass http://studium_admin:3002;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }
        }
        EOF
        exec nginx -g 'daemon off;'

volumes:
  mongodb_data: null

networks:
  npm-net:
    external: true
