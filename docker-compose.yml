services:

  mongodb:
    image: mongo:4.2.22
    container_name: "mongodb"
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - mongodb_data:/data/db
    networks:
      - default
      - npm-net
    ports:
      - 27017:27017


  studium_api:
    image: ghcr.io/vpo92/studium/api:latest
    ports:
      - 3000:3000
    environment:
      - NODE_ENV=production
      - APP_MODE=PROD
      - MONGODB_CONNECTION_STRING=mongodb://mongodb:27017/studium      
      - MONGO_URL=mongodb://mongodb/studium
    restart: always
    networks:
     - default
     - npm-net
    

  studium_admin:
    image: ghcr.io/vpo92/studium/admin:latest
    environment:
      - API_URL=${API_URL:-http://localhost:3000}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://studium-parisiense.univ-paris1.fr/api}
      - APPLICATION_URL=${APPLICATION_URL:-http://studium-parisiense.univ-paris1.fr}

    ports:
      - 3002:3002

    networks:
     - default
     - npm-net

volumes:
  mongodb_data: null

networks:
  npm-net:
    external: true
