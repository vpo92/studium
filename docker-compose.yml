services:

  studium_mongo:
    image: mongo:4.2.22
    container_name: "studium_mongo"
    environment:
      - MONGO_DATA_DIR=/data/db
      - MONGO_LOG_DIR=/dev/null
    volumes:
      - mongodb_data:/data/db
    networks:
      default:
        aliases:
          - mongodb
      npm-net:
        aliases:
          - mongodb
    expose:
      - 27017


  studium_api:
    image: ghcr.io/vpo92/studium/api:latest
    expose:
      - 3000
    depends_on:
      - studium_mongo
    environment:
      - NODE_ENV=production
      - APP_MODE=PROD
      - MONGODB_CONNECTION_STRING=mongodb://studium_mongo:27017/studium      
      - MONGO_URL=mongodb://studium_mongo/studium
      - FEAT_GRAPH=${FEAT_GRAPH:-false}
    restart: always
    networks:
     - default
     - npm-net

  # Exécute les traitements longs (réindexation, dump, indexation Neo4j...)
  # en dehors du processus HTTP de l'API. Voir api/src/services/jobs/.
  studium_worker:
    image: ghcr.io/vpo92/studium/api:latest
    command: ["node", "worker.js"]
    depends_on:
      - studium_mongo
    environment:
      - NODE_ENV=production
      - APP_MODE=PROD
      - MONGODB_CONNECTION_STRING=mongodb://studium_mongo:27017/studium
      - MONGO_URL=mongodb://studium_mongo/studium
      - WORKER_POLL_INTERVAL_MS=2000
      - WORKER_HEARTBEAT_MS=5000
      - WORKER_STALE_MS=60000
    stop_grace_period: 30s
    healthcheck:
      test: ["NONE"]
    restart: unless-stopped
    networks:
      - default
    

  studium_admin:
    image: ghcr.io/vpo92/studium/admin:latest
    environment:
      - API_URL=${API_URL:-http://studium_api:3000}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:3003/api}
      - APPLICATION_URL=${APPLICATION_URL:-http://localhost:3003}
      - FEAT_GRAPH=${FEAT_GRAPH:-false}

    expose:
      - 3002

    networks:
     - default
     - npm-net

  studium_neo4j:
    image: neo4j:5-community
    container_name: studium_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Interface web (Neo4j Browser)
      - "7687:7687" # Protocole Bolt (API Node.js)
    environment:
      - NEO4J_AUTH=neo4j/nAqwzs!12
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_db_tx__log_rotation_retention__policy=100M size
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - npm-net
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs



  studium_nginx:
    image: nginx:alpine
    container_name: "studium_nginx"
    restart: always
    ports:
      - 3003:80
    depends_on:
      - studium_api
      - studium_admin
    networks:
      - default
      - npm-net
    command:
      - /bin/sh
      - -c
      - |
        cat <<'EOF' > /etc/nginx/conf.d/default.conf
        server {
            listen 80;
            server_name localhost;

            client_max_body_size 50M;

            # API endpoints
            location /api/ {
                proxy_pass http://studium_api:3000/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }

            location = /api {
                proxy_pass http://studium_api:3000/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }

            location = /graph {
                return 301 /graph/;
            }

            location /graph/ {
                proxy_pass http://studium_neo4j:7474/;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # Réécriture des chemins racine de Neo4j Browser
                proxy_set_header Accept-Encoding "";
                sub_filter_types text/html application/javascript;
                sub_filter 'href="/' 'href="/graph/';
                sub_filter 'src="/' 'src="/graph/';
                sub_filter_once off;
            }

            # Admin application
            location / {
                proxy_pass http://studium_admin:3002;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $$scheme;
            }
        }
        EOF
        exec nginx -g 'daemon off;'

volumes:
  mongodb_data: null
  neo4j_data: null
  neo4j_logs: null

networks:
  npm-net:
    external: true
