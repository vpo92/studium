name: Build and Push Admin Docker Image (Gitea)

on:
  workflow_dispatch: # Permet aussi de lancer le build manuellement depuis l'interface Gitea

env:
  # Gitea n'accepte pas les "_" dans les noms de variables : IMAGENAME au lieu de IMAGE_NAME
  REGISTRY: ci.vincentpoupet.fr
  IMAGENAME: vincent/studium/admin

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    # Donne les droits au jeton Gitea de pousser sur le registre de paquets
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' admin/package.json | head -n1)
          if [ -z "$VERSION" ]; then echo "version introuvable dans admin/package.json" >&2; exit 1; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Gitea container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          # Utilise le jeton natif généré automatiquement pour chaque exécution sur Gitea
          password: ${{ secrets.TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGENAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          file: ./admin/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
